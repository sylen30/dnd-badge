; PlatformIO build config. (The Arduino IDE works too: open firmware/dnd-badge/dnd-badge.ino)

[platformio]
src_dir = firmware/dnd-badge

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    olikraus/U8g2@^2.35
